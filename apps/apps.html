<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>快捷入口页面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #1e3c72, #2a5298, #6a11cb, #2575fc);
      background-size: 400% 400%;
      animation: gradientMove 10s ease infinite;
      overflow: hidden;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      text-align: center;
      padding: 40px 30px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      animation: floatBox 3s ease-in-out infinite;
    }

    @keyframes floatBox {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      color: white;
      margin-bottom: 15px;
      font-size: 32px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    p {
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 30px;
      font-size: 16px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .btn {
      position: relative;
      padding: 15px 30px;
      font-size: 18px;
      color: white;
      background: linear-gradient(135deg, #ff6a00, #ee0979);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(238, 9, 121, 0.35);
    }

    .btn:hover {
      transform: scale(1.08) translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 106, 0, 0.5);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.25);
      transform: skewX(-25deg);
      transition: 0.6s;
    }

    .btn:hover::before {
      left: 120%;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.75);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Apps 快捷入口</h1>
    <div class="btn-group">
      <button class="btn" onclick="openLink('https://self-adjusting-top-tree.github.io/apps/decomposition.html')">
        分解质因数
      </button>

      <button class="btn" onclick="openLink('https://self-adjusting-top-tree.github.io/apps/miller-rabin.html')">
        判定质数
      </button>

      <button class="btn" onclick="openLink('')">
        To be continued...
      </button>
    </div>

    <div class="footer">Apps</div>
  </div>

  <script>
    function openLink(url) {
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
