<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Miller–Rabin 素性测试</title>
  <style>
    :root {
      --bg: #0b0c0f;
      --panel: #141720;
      --panel-2: #10131a;
      --text: #e6e8ee;
      --muted: #a8b0c2;
      --accent: #4da3ff;
      --border: #232836;
      --ok: #4bb96b;
      --warn: #ffb020;
      --err: #ff5a6b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji"; background: radial-gradient(1200px 700px at 70% -10%, #182033 0%, var(--bg) 60%); color: var(--text); }
    .wrap { max-width: 980px; margin: 0 auto; padding: 28px 18px 60px; }
    h1 { margin: 0 0 8px; font-size: 28px; font-weight: 700; }
    p.lead { margin: 0 0 22px; color: var(--muted); }

    .grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
    @media (min-width: 820px) { .grid { grid-template-columns: 2fr 1fr; } }

    .card { background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    .card h2 { margin: 0; padding: 14px 16px 0; font-size: 16px; color: var(--muted); font-weight: 600; }
    .card .body { padding: 14px 16px 16px; }

    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input[type="text"], select { width: 100%; padding: 12px 12px; background: #0f1320; border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; }
    input::placeholder { color: #6b7280; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    button { appearance: none; border: 0; border-radius: 10px; padding: 12px 14px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn { background: var(--accent); color: #07121f; }
    .btn:disabled { opacity: .65; cursor: default; }
    .btn-secondary { background: #1b2130; color: var(--text); border: 1px solid var(--border); }

    .muted { color: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .caps { text-transform: uppercase; letter-spacing: .06em; font-weight: 700; font-size: 12px; color: var(--muted); }

    .log { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 13px; background: #0c101a; border: 1px solid var(--border); border-radius: 10px; padding: 12px; height: 260px; overflow: auto; white-space: pre-wrap; }

    .pill { display: inline-block; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); background: #0d1220; font-size: 12px; margin-right: 8px; margin-bottom: 6px; }

    .result { font-size: 15px; }
    .result .n { color: var(--muted); }

    .kbd { display:inline-block; padding:2px 6px; border:1px solid var(--border); border-bottom-width:2px; border-radius:6px; background:#0f1524; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size:12px; }

    .footer { margin-top: 24px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Miller–Rabin 素性测试</h1>
    <p class="lead">支持大整数 <span class="mono">BigInt</span>。若 n < 2<sup>64</sup>，采用固定基实现确定性判断；更大数采用概率型测试。</p>

    <div class="grid">
      <div class="card">
        <h2>输入</h2>
        <div class="body">
          <label for="n">待检测整数 N（十进制）</label>
          <input id="n" type="text" placeholder="例如：1000000007 或 15241578753238836750190521" />

          <div class="row" style="margin-top:12px;">
            <div>
              <label for="rounds">随机基数量 k（概率 ≤ 4<sup>-k</sup>）</label>
              <input id="rounds" type="text" value="16" />
            </div>
            <div>
              <label for="seed">随机种子（可空）</label>
              <input id="seed" type="text" placeholder="留空则使用时间种子" />
            </div>
          </div>

          <div class="row" style="margin-top:12px;">
            <button id="start" class="btn">开始检测</button>
            <button id="stop" class="btn-secondary" disabled>停止</button>
          </div>

          <div style="margin-top:12px;" class="caps">运行信息</div>
          <div id="status" class="pill">空闲</div>
          <div id="timer" class="pill">0 ms</div>
          <div id="steps" class="pill">0 轮</div>

          <div style="margin-top:10px;">
            <div class="caps">日志</div>
            <div id="log" class="log"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>结果</h2>
        <div class="body">
          <div id="result" class="result">尚无结果</div>
          <div style="margin-top:12px;" class="caps">示例</div>
          <div class="muted" style="font-size:13px; line-height:1.6;">
            <div><span class="kbd" data-sample>1000000007</span> 素数（确定性）</div>
            <div><span class="kbd" data-sample>600851475143</span> 合数</div>
            <div><span class="kbd" data-sample>15241578753238836750190521</span> 合数</div>
            <div><span class="kbd" data-sample>2305843009213693951</span> 素数（梅森数 2^61-1）</div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">提示：输入后按 Enter 即可开始。合数时会给出一个见证基以供复现。</div>
  </div>

<script>
(function() {
  const $ = (id) => document.getElementById(id);
  const nInput = $('n');
  const roundsInput = $('rounds');
  const seedInput = $('seed');
  const startBtn = $('start');
  const stopBtn = $('stop');
  const statusEl = $('status');
  const timerEl = $('timer');
  const stepsEl = $('steps');
  const logEl = $('log');
  const resultEl = $('result');

  function log(line) {
    logEl.textContent += line + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  }
  function setStatus(text) { statusEl.textContent = text; }
  function setTimer(ms) { timerEl.textContent = ms + ' ms'; }
  function setSteps(k) { stepsEl.textContent = k + ' 轮'; }

  // ---------- BigInt helpers ----------
  function modPow(base, exp, mod) {
    if (mod === 1n) return 0n;
    let result = 1n;
    let b = ((base % mod) + mod) % mod;
    let e = exp;
    while (e > 0n) {
      if (e & 1n) result = (result * b) % mod;
      b = (b * b) % mod;
      e >>= 1n;
    }
    return result;
  }

  function isSmallPrime(n) {
    const small = [2n,3n,5n,7n,11n,13n,17n,19n,23n,29n,31n,37n];
    for (const p of small) {
      if (n === p) return true;
      if (n % p === 0n) return false;
    }
    return null; // 未决
  }

  // n-1 = d * 2^s
  function factorToDS(n) {
    let d = n - 1n; let s = 0n;
    while ((d & 1n) === 0n) { d >>= 1n; s++; }
    return { d, s };
  }

  function witnessOnce(a, n, d, s) {
    let x = modPow(a, d, n);
    if (x === 1n || x === n - 1n) return false;
    for (let r = 1n; r < s; r++) {
      x = (x * x) % n;
      if (x === n - 1n) return false;
    }
    return true; // 发现合数见证
  }

  // 确定性基（n < 2^64）
  const DETERMINISTIC_BASES = [2n, 325n, 9375n, 28178n, 450775n, 9780504n, 1795265022n];

  function makeRNGFromSeed(seedStr) {
    // xorshift64*
    let x = 0n;
    const seed = seedStr && seedStr.trim().length ? BigInt.asUintN(64, BigInt(hashStr(seedStr))) : BigInt.asUintN(64, BigInt(Date.now())) ^ 0x9e3779b97f4a7c15n;
    x = seed || 1n;
    return function () {
      x ^= x << 13n; x ^= x >> 7n; x ^= x << 17n;
      const z = BigInt.asUintN(64, x * 0x2545F4914F6CDD1Dn);
      return Number(z & 0xffffffffn);
    };
  }
  function hashStr(s) {
    let h = 0xcbf29ce484222325n; const p = 0x100000001b3n;
    for (let i=0;i<s.length;i++) { h ^= BigInt(s.charCodeAt(i) & 0xff); h = BigInt.asUintN(64, h * p); }
    return h;
  }
  function randomBaseLt(n, rng) {
    if (n <= 4n) return 2n; // 不会用到
    // 取区间 [2, n-2]
    const range = n - 3n; // 0..n-3，对应 2..n-1
    // 生成 0..range 的随机数
    const bits = range.toString(2).length;
    const bytes = Math.ceil(bits/8);
    while (true) {
      let r = 0n;
      for (let i=0;i<bytes;i++) {
        r = (r << 8n) + BigInt(rng() & 255);
      }
      if (r <= range) return r + 2n;
    }
  }

  async function run() {
    const raw = (nInput.value || '').trim();
    if (!/^[0-9]+$/.test(raw)) { alert('请输入十进制非负整数'); return; }
    const n = BigInt(raw);
    if (n < 2n) { alert('请输入大于等于 2 的整数'); return; }

    const k = Math.max(0, parseInt((roundsInput.value || '0').trim() || '0', 10));
    const rng = makeRNGFromSeed(seedInput.value);

    logEl.textContent = '';
    setStatus('运行中');
    setSteps(0);
    const t0 = performance.now();
    resultEl.textContent = '检测中…';

    try {
      // 先排除小素数和小合数
      const sp = isSmallPrime(n);
      if (sp === true) {
        setStatus('完成');
        const elapsed = Math.round(performance.now() - t0);
        setTimer(elapsed); setSteps(0);
        resultEl.innerHTML = `N = <span class="n mono">${n}</span><br/>结果：<span style="color:var(--ok);font-weight:700;">素数</span>（小素数命中）<br/>用时 ${elapsed} ms`;
        return;
      } else if (sp === false) {
        setStatus('完成');
        const elapsed = Math.round(performance.now() - t0);
        setTimer(elapsed); setSteps(0);
        resultEl.innerHTML = `N = <span class="n mono">${n}</span><br/>结果：<span style="color:var(--err);font-weight:700;">合数</span>（被小素数整除）<br/>用时 ${elapsed} ms`;
        return;
      }

      // 分解 n-1 = d * 2^s
      const { d, s } = factorToDS(n);

      // 若 n < 2^64，使用固定基确定性判断
      const TWO64 = 1n << 64n;
      let roundsDone = 0;
      if (n < TWO64) {
        log('使用 64 位确定性基');
        for (const a of DETERMINISTIC_BASES) {
          const aa = a % n; if (aa <= 1n) { roundsDone++; continue; }
          if (witnessOnce(aa, n, d, s)) {
            const elapsed = Math.round(performance.now() - t0);
            setTimer(elapsed); setSteps(roundsDone);
            setStatus('完成');
            resultEl.innerHTML = `N = <span class="n mono">${n}</span><br/>结果：<span style=\"color:var(--err);font-weight:700;\">合数</span><br/>见证基 a = <span class=\"mono\">${aa}</span><br/>用时 ${elapsed} ms，轮数 ${roundsDone}`;
            return;
          }
          roundsDone++;
          if (roundsDone % 8 === 0) await new Promise(r => setTimeout(r, 0));
        }
        const elapsed = Math.round(performance.now() - t0);
        setTimer(elapsed); setSteps(roundsDone);
        setStatus('完成');
        resultEl.innerHTML = `N = <span class="n mono">${n}</span><br/>结果：<span style="color:var(--ok);font-weight:700;">素数</span>（确定性，2^64 范围内）<br/>用时 ${elapsed} ms，轮数 ${roundsDone}`;
        return;
      }

      // 概率型：随机取 k 个基（默认 16）
      const kk = Math.max(1, k || 16);
      log(`使用概率型测试，随机基数量 k = ${kk}`);
      for (let i=0;i<kk;i++) {
        const a = randomBaseLt(n, rng);
        if (witnessOnce(a % n, n, d, s)) {
          const elapsed = Math.round(performance.now() - t0);
          setTimer(elapsed); setSteps(i+1);
          setStatus('完成');
          resultEl.innerHTML = `N = <span class="n mono">${n}</span><br/>结果：<span style=\"color:var(--err);font-weight:700;\">合数</span><br/>见证基 a = <span class=\"mono\">${a}</span><br/>用时 ${elapsed} ms，轮数 ${i+1}`;
          return;
        }
        if (i % 8 === 7) await new Promise(r => setTimeout(r, 0));
        stepsEl.textContent = (i+1) + ' 轮';
        if (cancelRef.cancelled) { setStatus('已停止'); resultEl.textContent = '已停止'; return; }
      }

      const elapsed = Math.round(performance.now() - t0);
      setTimer(elapsed); setSteps(kk);
      setStatus('完成');
      resultEl.innerHTML = `N = <span class="n mono">${n}</span><br/>结果：<span style="color:var(--ok);font-weight:700;">可能是素数</span>（误判概率 ≤ 4<sup>-${kk}</sup>）<br/>用时 ${elapsed} ms，轮数 ${kk}`;
    } catch (e) {
      setStatus('错误');
      resultEl.textContent = '出错：' + e.message;
      console.error(e);
    }
  }

  // ---------- UI wiring ----------
  let cancelRef = { cancelled: false };
  startBtn.addEventListener('click', () => { cancelRef = { cancelled: false }; run(); });
  stopBtn.addEventListener('click', () => { cancelRef.cancelled = true; stopBtn.disabled = true; setStatus('停止中…'); });
  nInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') startBtn.click(); });

  // 点击示例
  document.querySelectorAll('[data-sample]').forEach(el => {
    el.addEventListener('click', () => { nInput.value = el.textContent.trim(); nInput.focus(); });
  });
})();
</script>
</body>
</html>
